name: Pa11y

on: [pull_request]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx -p http-server@14 http-server dist/client -p 4321 &
      - run: sleep 4
      - run: npx pa11y-ci --config .pa11yci.json
